<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NGC AI — College AI Assistant</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div class="app">

        <header class="header">
    <div class="brand">
        <div class="logo">
            <img src="assets/college-logo.png" alt="Nagarjuna Government College Logo">
        </div>

        <div class="brand-text">
            <h1>NGC AI</h1>
            <p>College AI Assistant</p>
        </div>
    </div>

    <div class="header-actions">
        <button id="clearChat" class="clear-btn">
            Clear
        </button>
    </div>
</header>

        <!-- Chat Area -->
        <main id="chatContainer" class="chat-container">

           <div class="welcome">

<div class="welcome-orb">
    <i data-lucide="sparkles"></i>
</div>

  <h2>
    Hello
    <i data-lucide="hand" class="hello-hand"></i>
</h2>

    <h3>How can I help you today?</h3>

    <p>
        Ask about courses, admissions, notices,
        programs and college information.
    </p>

   <div class="suggestions">

    <button class="suggestion">
        <span class="suggestion-icon">
            <i data-lucide="book-open"></i>
        </span>

        <span>
            <strong>Courses</strong>
            <small>Explore available courses</small>
        </span>
    </button>

    <button class="suggestion">
        <span class="suggestion-icon">
            <i data-lucide="megaphone"></i>
        </span>

        <span>
            <strong>Notices</strong>
            <small>Find the latest updates</small>
        </span>
    </button>

    <button class="suggestion">
        <span class="suggestion-icon">
            <i data-lucide="graduation-cap"></i>
        </span>

        <span>
            <strong>Programs</strong>
            <small>Explore academic programs</small>
        </span>
    </button>

    <button class="suggestion">
        <span class="suggestion-icon">
            <i data-lucide="sparkles"></i>
        </span>

        <span>
            <strong>Ask AI</strong>
            <small>Ask me anything</small>
        </span>
    </button>

</div>

</div>

        </main>


        <!-- Input Area -->
        <footer class="input-area">

            <form id="chatForm">

                <div class="input-wrapper">

                    <textarea
                        id="messageInput"
                        placeholder="Ask anything..."
                        rows="1"
                        autocomplete="off"
                    ></textarea>

                    <button
                        type="submit"
                        id="sendButton"
                        aria-label="Send message"
                    >
                        ➤
                    </button>

                </div>

                <p class="disclaimer">
                    NGC AI can make mistakes. Verify important information.
                </p>

            </form>

        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
